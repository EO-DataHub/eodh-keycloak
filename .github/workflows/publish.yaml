name: Build and Publish Docker Image

on:
  push:
    tags:
      - v[0-9]+*
    branches:
      - "**"

jobs:
  prechecks:
    name: Prechecks
    runs-on: ubuntu-latest
    steps:
      - run: |
          RETURN_CODE=0
          if [ -z "${{ vars.IMAGE_NAME }}" ]; then
            echo "Github vars.IMAGE_NAME required for publish"
            RETURN_CODE=1
          fi
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "Github vars.AWS_ROLE_ARN required for publish"
            RETURN_CODE=1
          fi
          if [ -z "${{ vars.AWS_ECR_ALIAS }}" ]; then
            echo "Github vars.AWS_ECR_ALIAS required for publish"
            RETURN_CODE=1
          fi
          exit $RETURN_CODE
  publish:
    name: Build and push Docker image
    needs: [prechecks]
    uses: EO-DataHub/github-actions/.github/workflows/ecr-publish.yaml@main
    with:
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ECR_ALIAS: ${{ vars.AWS_ECR_ALIAS }}
    permissions:
      id-token: write
      contents: read
