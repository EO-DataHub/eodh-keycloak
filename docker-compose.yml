services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "${POSTGRES_PORT:-8432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    restart: always
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - start-dev
      - --import-realm
      - --features
      - parameterized-scopes:v1,token-exchange:v1,admin-fine-grained-authz:v1
      - --spi-oauth2-token-exchange--provider
      - scope-enhanced-token-exchange
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: INFO
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./test-realm.json:/opt/keycloak/data/import/test-realm.json
    depends_on:
      - postgres
    networks:
      - keycloak-network
    restart: always
  workspaces:
    build:
      context: .
      dockerfile: Dockerfile.workspaces
    environment:
      ALLOWED_USERS: user
    ports:
      - "${WORKSPACES_PORT:-8000}:8000"
    networks:
      - keycloak-network
    restart: always

volumes:
  postgres_data:

networks:
  keycloak-network:
    driver: bridge
