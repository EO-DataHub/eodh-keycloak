services:
  postgres:
    image: postgres:14
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    restart: always
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    command: [start-dev, --import-realm, --features, dynamic-scopes]
    container_name: keycloak
    environment:
      DB_VENDOR: postgres
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./test-realm.json:/opt/keycloak/data/import/test-realm.json
    depends_on:
      - postgres
    networks:
      - keycloak-network
    restart: always
  workspaces:
    build: 
      context: .
      dockerfile: Dockerfile.workspaces
    container_name: workspaces
    environment:
      ALLOWED_USER: user
    ports:
      - "8000:8000"
    networks:
      - keycloak-network
    restart: always

volumes:
  postgres_data:

networks:
  keycloak-network:
    driver: bridge
