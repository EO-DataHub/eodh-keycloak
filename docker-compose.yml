services:
  postgres:
    image: postgres:14
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "8432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    restart: always
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - start-dev
      - --import-realm
      - --features
      - dynamic-scopes:v1,token-exchange:v1
      # - --spi-oauth2-token-exchange-provider
      # - tpzuk.eodh.keycloak.TPZUKTokenExchangeProvider
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./test-realm.json:/opt/keycloak/data/import/test-realm.json
    depends_on:
      - postgres
    networks:
      - keycloak-network
    restart: always
  workspaces:
    build:
      context: .
      dockerfile: Dockerfile.workspaces
    container_name: workspaces
    environment:
      ALLOWED_USERS: user
    ports:
      - "8000:8000"
    networks:
      - keycloak-network
    restart: always

volumes:
  postgres_data:

networks:
  keycloak-network:
    driver: bridge
